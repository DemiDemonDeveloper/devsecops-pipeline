# Install once per clone:  pre-commit install
repos:
  # Local wrapper instead of the upstream gitleaks hook: the upstream hook
  # silently passes secrets when git color is forced (see the script).
  # Requires gitleaks on PATH (brew install gitleaks).
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets (gitleaks)
        entry: scripts/gitleaks-staged.sh
        language: script
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-system # uses the brew-installed binary
