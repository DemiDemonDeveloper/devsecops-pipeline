name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every third-party action is pinned to a commit SHA and every scanner image to a
# digest, so a re-pointed tag upstream can't inject code into this pipeline.
env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
  TRIVY_IMAGE: aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 # 0.76.0
  CHECKOV_IMAGE: bridgecrew/checkov@sha256:6d20ebbcde58b2dce6e3151a6771fefa4d468281fe442475455623f5799b9f53 # 3.3.20
  SYFT_IMAGE: anchore/syft@sha256:3eb5379ba7b409c3f4069b686110527af0c47df993fa5c10d13e7cf34f49b1aa # v1.54.1
  GOVULNCHECK_VERSION: v1.9.0
  IMAGE: devsecops-api:${{ github.sha }}

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the tip
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git --redact --verbose --config .gitleaks.toml --exit-code 1

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3 # 1.180.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Custom rule tests
        run: semgrep --metrics=off --test --config .semgrep/rules.yml .semgrep/rules.go
      - name: Semgrep scan (OWASP Top 10, Go, secrets, custom rules)
        run: |
          semgrep scan --metrics=off --error \
            --config p/golang --config p/owasp-top-ten --config p/secrets \
            --config .semgrep/rules.yml \
            --sarif-output=semgrep.sarif .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  test:
    name: Go test + govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: govulncheck (reachable Go/stdlib CVEs)
        run: go run golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}" ./...

  deps:
    name: Dependency + Dockerfile scan (Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: trivy fs
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs --quiet \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --skip-dirs /src/terraform/tests --exit-code 1 /src

  iac:
    name: IaC scan (Terraform, Checkov, Trivy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Checkov
        run: |
          docker run --rm -v "$PWD:/tf" "$CHECKOV_IMAGE" -d /tf --framework terraform \
            --skip-path tests --compact --quiet
      - name: Trivy config (tfsec rules)
        run: |
          docker run --rm -v "$PWD:/tf" "$TRIVY_IMAGE" config --quiet \
            --severity HIGH,CRITICAL --skip-dirs /tf/tests --exit-code 1 /tf
      - name: Gate self-test (insecure fixture must fail)
        run: |
          if docker run --rm -v "$PWD:/tf" "$CHECKOV_IMAGE" -d /tf/tests/insecure --framework terraform --quiet >/dev/null; then
            echo "::error::Checkov passed an intentionally insecure fixture"; exit 1; fi
          if docker run --rm -v "$PWD:/tf" "$TRIVY_IMAGE" config --quiet --severity HIGH,CRITICAL --exit-code 1 /tf/tests/insecure >/dev/null; then
            echo "::error::Trivy passed an intentionally insecure fixture"; exit 1; fi
          echo "Both scanners correctly blocked the insecure fixture."

  build:
    name: Build, scan, push, sign
    runs-on: ubuntu-latest
    needs: [secrets, sast, test, deps, iac]
    permissions:
      contents: read
      packages: write # push to GHCR (main only)
      id-token: write # keyless Cosign signing via GitHub OIDC (main only)
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t "$IMAGE" .
      - name: SBOM (Syft, CycloneDX + SPDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" "$SYFT_IMAGE" \
            "docker:$IMAGE" -o cyclonedx-json=/out/sbom.cdx.json -o spdx-json=/out/sbom.spdx.json
      - name: Scan SBOM for vulnerable components (Trivy)
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" sbom --quiet \
            --severity HIGH,CRITICAL --exit-code 1 /src/sbom.cdx.json
      - name: Scan image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image --quiet \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.*.json

      # ---- Publish: only reached if every scan above passed ----
      - name: Push to GHCR
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}/api"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE" "$REPO:${GITHUB_SHA}"
          docker push -q "$REPO:${GITHUB_SHA}"
          # Sign/verify by immutable digest, never by tag
          REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$REPO:${GITHUB_SHA}")
          echo "REF=$REF" >> "$GITHUB_ENV"
          echo "Pushed $REF" >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'
        with:
          cosign-release: v3.1.3
      - name: Sign image + attach SBOM attestation (keyless)
        if: env.PUBLISH == 'true'
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"
      - name: Verify signature and attestation
        if: env.PUBLISH == 'true'
        run: |
          ID="${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}"
          ISSUER=https://token.actions.githubusercontent.com
          cosign verify --certificate-identity "$ID" --certificate-oidc-issuer "$ISSUER" "$REF" > /dev/null
          cosign verify-attestation --type cyclonedx --certificate-identity "$ID" --certificate-oidc-issuer "$ISSUER" "$REF" > /dev/null
          echo "Signature + SBOM attestation verified for $REF (identity: $ID)" >> "$GITHUB_STEP_SUMMARY"
